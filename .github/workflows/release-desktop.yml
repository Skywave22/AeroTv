name: Desktop builds

# Phase 5 of the roadmap. Manual-only until the desktop UX pass is done.
on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
            target: linux
          - os: windows-latest
            name: Windows
            target: windows
          - os: macos-latest
            name: macOS
            target: macos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Linux build deps
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libmpv-dev libsecret-1-dev libjsoncpp-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter config --enable-${{ matrix.target }}-desktop
      - run: flutter pub get

      - name: Generate platform folders
        working-directory: apps/aero_app
        run: flutter create --platforms=${{ matrix.target }} --org app.orbit --project-name aero_app --no-pub .

      - name: Build
        working-directory: apps/aero_app
        run: flutter build ${{ matrix.target }} --release

      - uses: actions/upload-artifact@v4
        with:
          name: aero-tv-${{ matrix.target }}
          path: |
            apps/aero_app/build/${{ matrix.target }}/**/Release/**
            apps/aero_app/build/${{ matrix.target }}/x64/release/bundle/**
          if-no-files-found: warn
