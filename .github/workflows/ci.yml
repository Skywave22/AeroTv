name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Show toolchain
        run: flutter --version

      # The workspace resolves every package in one pass.
      - name: Resolve dependencies
        run: flutter pub get

      # Generated Drift code is committed, so CI never needs build_runner.
      # This step verifies the committed code is up to date.
      # Generated Drift code is committed so CI never *needs* build_runner.
      # This step only verifies the committed file matches a fresh generation.
      # Output goes OUTSIDE the repo: a generated copy left inside the package
      # would be picked up by `dart analyze` and reported as duplicate classes.
      - name: Verify generated code is current
        working-directory: packages/aero_data
        continue-on-error: true
        run: |
          OUT="$RUNNER_TEMP/drift_check"
          dart run build_runner build --delete-conflicting-outputs --output="$OUT"
          if ! diff -q lib/src/db/database.g.dart "$OUT/lib/src/db/database.g.dart"; then
            echo "::error::database.g.dart is stale. Run 'dart run build_runner build --delete-conflicting-outputs' in packages/aero_data and commit the result."
            exit 1
          fi

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Test aero_core
        working-directory: packages/aero_core
        run: dart test

      - name: Test eco_stremio
        working-directory: packages/eco_stremio
        run: dart test

      - name: Test aero_data
        working-directory: packages/aero_data
        run: flutter test

      - name: Test eco_js_runtime
        working-directory: packages/eco_js_runtime
        run: flutter test

      # The JS ecosystem packages depend on Flutter transitively, so they use
      # `flutter test`, not `dart test`.
      - name: Test eco_skystream
        working-directory: packages/eco_skystream
        run: flutter test

      - name: Test eco_vega
        working-directory: packages/eco_vega
        run: flutter test

      - name: Test eco_nuvio
        working-directory: packages/eco_nuvio
        run: flutter test

      - name: Test aero_ui (TV focus / D-pad)
        working-directory: packages/aero_ui
        run: flutter test

      - name: Test app
        working-directory: apps/aero_app
        run: flutter test

      # Phase 1 exit criterion 6: >=70% line coverage in the two packages that
      # carry the domain and the shipping ecosystem.
      - name: Coverage gate (aero_core, eco_stremio >= 70%)
        run: |
          dart pub global activate coverage
          export PATH="$PATH:$HOME/.pub-cache/bin"
          fail=0
          for p in aero_core eco_stremio; do
            ( cd "packages/$p" \
              && dart test --coverage=coverage \
              && dart pub global run coverage:format_coverage \
                   --lcov -i coverage -o coverage/lcov.info \
                   --report-on=lib --package=. )
            pct=$(awk -F: '
              /^LF:/ { total += $2 }
              /^LH:/ { hit   += $2 }
              END { if (total > 0) printf "%.1f", 100 * hit / total; else print "0.0" }
            ' "packages/$p/coverage/lcov.info")
            echo "$p line coverage: $pct%"
            if awk -v v="$pct" 'BEGIN { exit !(v < 70) }'; then
              echo "::error::$p coverage $pct% is below the 70% minimum"
              fail=1
            fi
          done
          exit $fail
