name: aero_app
description: Aero TV — a neutral media player and plugin host. Ships with no content.
version: 0.1.0+1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  # Referenced by a transitive plugin; declared so the release build does not
  # warn about a missing CupertinoIcons font family.
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  aero_core:
    path: ../../packages/aero_core
  aero_data:
    path: ../../packages/aero_data
  aero_ui:
    path: ../../packages/aero_ui
  aero_player:
    path: ../../packages/aero_player
  eco_stremio:
    path: ../../packages/eco_stremio
  eco_js_runtime:
    path: ../../packages/eco_js_runtime
  eco_vega:
    path: ../../packages/eco_vega
  eco_nuvio:
    path: ../../packages/eco_nuvio
  eco_skystream:
    path: ../../packages/eco_skystream
  eco_cloudstream:
    path: ../../packages/eco_cloudstream

  media_kit: ^1.2.6
  flutter_riverpod: ^2.6.1
  go_router: ^18.1.2
  dio: ^5.11.1
  cached_network_image: ^3.4.1
  palette_generator: ^0.3.3+7
  flutter_secure_storage: ^11.2.0
  qr_flutter: ^4.1.0
  share_plus: ^13.3.1
  file_picker: ^13.3.2
  url_launcher: ^6.3.3
  package_info_plus: ^10.2.2
  device_info_plus: ^13.3.0
  intl: ^0.20.3
  collection: ^1.19.1
  path_provider: ^2.1.6
  # NOTE: window_manager is intentionally NOT included yet. It pulls Dart
  # native assets that require GTK headers to build on Linux CI. Add it in
  # Phase 5 (desktop) together with the desktop workflow's apt-get deps.

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
