org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m
org.gradle.parallel=false
org.gradle.caching=true
android.useAndroidX=true
android.enableJetifier=false
# Kotlin incremental compilation speeds up CI rebuilds.
kotlin.incremental=true
kotlin.daemon.jvmargs=-Xmx1024m
kotlin.code.style=official
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Safety net: if a future plugin introduces a Java/Kotlin target mismatch that
# the alignment block in build.gradle.kts cannot resolve, warn instead of
# failing the whole release build. Everything is dexed by D8 regardless.
kotlin.jvm.target.validation.mode=warning
