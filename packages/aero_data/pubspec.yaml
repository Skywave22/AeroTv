name: aero_data
description: Drift/SQLite persistence, repositories, cache and secure settings for Aero TV.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  aero_core:
    path: ../aero_core
  collection: ^1.19.1
  dio: ^5.11.1
  # Pinned to the sqlite3 2.x line on purpose: sqlite3 3.x + *_flutter_libs 0.6
  # switched to Dart native assets, which needs extra CI toolchain setup.
  drift: 2.31.0
  sqlite3: ^2.9.4
  sqlite3_flutter_libs: 0.5.42
  path: ^1.9.1
  path_provider: ^2.1.6
  flutter_secure_storage: ^11.2.0
  crypto: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
  drift_dev: 2.31.0
  build_runner: ^2.7.0
