name: aero_player
description: media_kit/libmpv player wrapper with subtitle, audio-track and resume support.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  aero_core:
    path: ../aero_core
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_android_video: ^1.3.8
  wakelock_plus: ^1.4.0
  screen_brightness: ^2.1.11
  volume_controller: ^3.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
